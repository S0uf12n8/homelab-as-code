---
- name: Make deploy passwordless sudo
  hosts: all
  become: true

  tasks:
    - name: Create sudoers drop-in for deploy
      ansible.builtin.copy:
        dest: /etc/sudoers.d/deploy
        content: "deploy ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s
