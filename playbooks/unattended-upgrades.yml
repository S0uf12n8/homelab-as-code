---
- name: Configure automatic secutity updates
  hosts: homelab
  become: true

  tasks:
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
        update_cache: true


    - name: Deploy unattended-upgrades configuration
      ansible.builtin.template:
        src: ../templates/20auto-upgrades.j2
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: '0644'
        backup: true

