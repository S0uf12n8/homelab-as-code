---
- name: User Management
  hosts: all
  become: true

  tasks:
    - name: Add user
      ansible.builtin.user:
        name: deploy
        groups: sudo
        append: true
        shell: /bin/bash
        state: present
        create_home: true
    - name: Add ssh
      ansible.posix.authorized_key:
        user: deploy
        state: present
        key: "{{ lookup('file', '/home/souf/.ssh/homelab_key.pub') }}"
