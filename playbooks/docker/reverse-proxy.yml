---
- name: Deploy Docker reverse proxy
  hosts: all
  become: true

  tasks:

    - name: Ensure proxy network exists
      community.docker.docker_network:
        name: proxy-lab
        state: present

    - name: Deploy application container
      community.docker.docker_container:
        name: app
        image: traefik/whoami:latest
        state: started
        restart_policy: unless-stopped
        networks:
          - name: proxy-lab

    - name: Create Nginx configuration directory
      ansible.builtin.file:
        path: /opt/reverse-proxy
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy Nginx configuration
      ansible.builtin.template:
        src: ../../templates/reverse-proxy.conf.j2
        dest: /opt/reverse-proxy/default.conf
        owner: root
        group: root
        mode: "0644"

    - name: Deploy Nginx reverse proxy
      community.docker.docker_container:
        name: reverse-proxy
        image: nginx:latest
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "8081:80"
        networks:
          - name: proxy-lab
        volumes:
          - /opt/reverse-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
