name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          python3 -m pip install --user ansible

      - name: Install ansible-lint
        run: |
          python3 -m pip install --user ansible-lint

      - name: Check Ansible syntax
        run: |
          find playbooks -name "*.yml" -type f -print0 | while IFS= read -r -d '' playbook; do
            echo "Checking: $playbook"
            ansible-playbook "$playbook" --syntax-check || exit 1
          done

      - name: Run ansible-lint
        run: |
          ansible-lint

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/arm64 \
            -t ghcr.io/s0uf12n8/homelab-ci-demo:latest \
            -t ghcr.io/s0uf12n8/homelab-ci-demo:${{ github.sha }} \
            ./docker/ci-demo

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push ghcr.io/s0uf12n8/homelab-ci-demo:latest
          docker push ghcr.io/s0uf12n8/homelab-ci-demo:${{ github.sha }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 84.8.220.209 >> ~/.ssh/known_hosts

      - name: Configure Ansible SSH
        run: |
          mkdir -p ~/.ansible
          cat > ~/.ansible/ansible.cfg <<'EOF'
          [defaults]
          private_key_file = /home/runner/.ssh/deploy_key
          host_key_checking = True
          EOF

      - name: Deploy CI demo
         run: |
          ansible-playbook playbooks/docker/docker-ci-demo.yml \
             -e "image_tag=${{ github.sha }}"
